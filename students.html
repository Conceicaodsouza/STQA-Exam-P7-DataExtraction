<!DOCTYPE html>
<html>
<head>
    <title>STQA Student Marks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #eeeeee;
        }
    </style>
</head>

<body>

<h1>Student Marks Table</h1>

<table id="studentTable">

    <thead>
        <tr>
            <th>Roll No</th>
            <th>Student Name</th>
            <th>English</th>
            <th>Mathematics</th>
            <th>Science</th>
        </tr>
    </thead>

    <tbody id="studentTableBody">
    </tbody>

</table>

<script>

const students = [
    [101, "Aarav", 72, 55, 68],
    [102, "Diya", 45, 52, 58],
    [103, "Rohan", 81, 67, 74],
    [104, "Ananya", 55, 61, 49],
    [105, "Kabir", 39, 48, 52],
    [106, "Meera", 65, 58, 62],
    [107, "Rahul", 51, 44, 59],
    [108, "Isha", 76, 69, 71],
    [109, "Arjun", 42, 57, 46],
    [110, "Sara", 63, 54, 60]
];

const tableBody = document.getElementById("studentTableBody");

students.forEach(function(student) {

    const row = document.createElement("tr");

    student.forEach(function(value) {

        const cell = document.createElement("td");

        cell.textContent = value;

        row.appendChild(cell);

    });

    tableBody.appendChild(row);
});

</script>

</body>
</html>
